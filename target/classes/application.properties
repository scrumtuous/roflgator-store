# Default to local development.
# In Beanstalk, set SPRING_PROFILES_ACTIVE=aws.

spring.profiles.default=dev

server.port = 8080

# Shared JPA settings.
spring.jpa.open-in-view=false

# Shared Kafka producer settings.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Shared Kafka consumer settings.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mcnz.store
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

# Swagger UI.
springdoc.swagger-ui.path=/swagger-ui.html

# Logging.
logging.level.org.apache.kafka=WARN
logging.level.kafka=WARN
logging.level.state.change.logger=WARN

#---
spring.config.activate.on-profile=dev

# Local in-memory database.
spring.datasource.url=jdbc:h2:mem:storedb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# The dev-only embedded Kafka broker supplies
# spring.kafka.bootstrap-servers at startup.

